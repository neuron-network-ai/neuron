<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60"
     role="img" aria-labelledby="neuron-logo-title">
  <title id="neuron-logo-title">NEURON</title>
  <!--
    The wide lockup, matching the mark inlined in the site header so the repo and the site do
    not disagree. A driver node feeds a hub, which fans out to two peers: each circle is a
    machine holding a slice of the model, each line is activations crossing between them, and
    the hub is largest because it carries the most.

    Recoloured from the earlier blue version when the site moved to green. Solid fills and
    strokes only — no gradients, no filters — so it stays crisp at any size.
  -->
  <g stroke="#15803d" stroke-linecap="round">
    <line x1="16" y1="30" x2="22" y2="30" stroke-width="2.5"/>
    <line x1="38" y1="27" x2="44" y2="17" stroke-width="2"/>
    <line x1="38" y1="33" x2="44" y2="43" stroke-width="2"/>
  </g>
  <circle cx="12" cy="30" r="6"   fill="#15803d"/>
  <circle cx="30" cy="30" r="8"   fill="#22c55e"/>
  <circle cx="47" cy="15" r="4.5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <circle cx="47" cy="45" r="4.5" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>

  <text x="66" y="39"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="700" letter-spacing="-0.5" fill="#166534">NEURON</text>
</svg>
