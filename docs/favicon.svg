<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32"
     role="img" aria-labelledby="neuron-favicon-title">
  <title id="neuron-favicon-title">NEURON</title>
  <!--
    Matches the mark used in the site header: a driver node feeding a hub, which fans out to
    two peers. Each circle is a machine holding a slice of the model; the lines are activations
    crossing between them. The hub is the largest because it carries the most.

    Redrawn rather than scaled from the 48px hero version — proportionally shrinking that one
    turns the connectors to grey mush in a tab. Heavier lines, fewer of them, tighter padding.
    No background rectangle, so it sits correctly on a light or dark tab strip.
  -->
  <g stroke="#15803d" stroke-width="2.6" stroke-linecap="round">
    <line x1="8"  y1="16" x2="12" y2="16"/>
    <line x1="21" y1="14" x2="25" y2="7"/>
    <line x1="21" y1="18" x2="25" y2="25"/>
  </g>
  <circle cx="5"  cy="16" r="4"   fill="#15803d"/>
  <circle cx="16" cy="16" r="5.6" fill="#22c55e"/>
  <circle cx="27" cy="6"  r="3.4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <circle cx="27" cy="26" r="3.4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
</svg>
